<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Oddiy WebSocket Testi</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #status {
            font-weight: bold;
            margin-bottom: 10px;
        }

        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: scroll;
            background-color: #f9f9f9;
        }

        .server-msg {
            color: darkblue;
        }

        .client-msg {
            color: darkgreen;
        }
    </style>
</head>
<body>

<h1>WebSocket Testi</h1>

<input id="username" placeholder="input username" required>
<button onclick="setUsername()">Connect</button>

<div id="status">Ulanish holati: Yopilgan</div>

<input type="text" id="messageInput" placeholder="Yuboriladigan xabar"/>
<button onclick="sendMessage()">Yuborish</button>
<button onclick="closeConnection()">Ulanishni uzish</button>

<hr>

<h2>Xabarlar</h2>
<div id="messages"></div>
</th:block>


<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">


    let stopmClient = null;
    let socket = null;
    let username = null;
    const statusDiv = document.getElementById('status');
    const messagesDiv = document.getElementById('messages');
    const usernameIn = document.getElementById('username');
    const messageInput = document.getElementById('messageInput');


    function setUsername() {
        console.log(usernameIn.value)
        username = usernameIn.value;
    }

    function connect() {

        try {
            socket = new SockJS("/ws");
            stopmClient = Stomp.over(socket);
            statusDiv.textContent = 'Ulanish holati: Ulanmoqda...';

            stopmClient.connect({}, () => {
                statusDiv.textContent = 'Ulanish holati: **Ochiq** (Serverga ulangan)';

                stopmClient.subscribe("/topic/messages", (event) => {
                    const data = JSON.parse(event.body);
                    addMessage(data.sender, data.message, data.sendTime)
                })

            }, (error) => {
                console.error('Ulanishda xato:', error);
                document.getElementById('status').textContent = 'Xato ❌';
                setTimeout(connect, 3000); // 5 soniyadan keyin qayta urinish
            })

        } catch (error) {
            statusDiv.textContent = 'Ulanish holati: **Xatolik**';
        }
    }

    // Xabar yuborish funksiyasi
    function sendMessage() {
        const message = messageInput.value.trim();
        if (message === "") {
            alert("Iltimos, yuboriladigan xabarni kiriting.");
            return;
        }

        // Serverga xabar yuborish
        stopmClient.send('/app/send', {}, JSON.stringify({
            message: message,
            sender: username
        }))

        messageInput.value = ''; // Inputni tozalash
    }

    // Xabarni ro'yxatga qo'shish yordamchi funksiyasi
    function addMessage(sender, message, time) {
        const p = document.createElement('p');
        p.innerHTML = `[${time}] **${sender}:** ${message}`;
        messagesDiv.appendChild(p);
        // Eng oxirgi xabarga o'tish
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Sahifa yuklanganda avtomatik ulanishni sinash
    window.onload = connect;

</script>

</body>
</html>
